<html>
<head>
    <title>MAVLink example</title>
</head>
<body>
    <h1>Display of MAVLink Data</h1>

    <button id="stop_button" onclick="emergencyStop()" style="background:#c0392b;color:white;font-weight:bold;font-size:1.2em;padding:10px 20px;">
        STOP
    </button>
    <p id="stop_status"></p>

    <h2>Global Position Data</h2>
    <h3>
        Heading: <span id="hdg">--.-</span> <br>
        Latitude: <span id="lat">--.-</span> <br>
        Longitude: <span id="lon">--.-</span> <br>
    </h3>
    <h3>
        Last updated:
        <span id="last_gps">--.-</span>
        seconds ago
    </h3>

    <h2>Vehicle Mode</h2>
    <h3>
        Current mode: <span id="current_mode">--</span>
    </h3>
    <button onclick="setMode('hold')">HOLD</button>
    <button onclick="setMode('guided')">GUIDED</button>
    <button onclick="setMode('manual')">MANUAL</button>
    <button onclick="setMode('auto')">AUTO</button>
    <p id="mode_status"></p>

    <h2>Waypoint</h2>
    <label>Latitude: <input type="text" id="wp_lat" placeholder="e.g. 41.4901"></label><br>
    <label>Longitude: <input type="text" id="wp_lon" placeholder="e.g. -71.4128"></label><br>
    <button onclick="goToWaypoint()">Go to Waypoint</button>
    <button onclick="useCurrentPositionAsWaypoint()">Fill with current position</button>
    <p id="waypoint_status"></p>

    <script>
        let lastUpdateTime = Date.now();
        let lastGPS = null; // cache the latest fix so "use current position" works

        async function updateGPS() {
            try {
                const response = await fetch("/gps");
                if (!response.ok) throw new Error(`Status ${response.status}`);
                const data = await response.json();
                lastGPS = data;
                document.getElementById("hdg").textContent = data.heading.toFixed(1);
                if (data.has_fix) {
                    document.getElementById("lat").textContent = data.latitude.toFixed(6);
                    document.getElementById("lon").textContent = data.longitude.toFixed(6);
                } else {
                    document.getElementById("lat").textContent = "No GPS data available";
                    document.getElementById("lon").textContent = "No GPS data available";
                }
                lastUpdateTime = Date.now();
            } catch (err) {
                console.error("Failed to update GPS:", err);
            }
        }

        function updateLastGPS() {
            const seconds = ((Date.now() - lastUpdateTime) / 1000).toFixed(1);
            document.getElementById("last_gps").textContent = seconds;
        }

        async function updateCurrentMode() {
            try {
                const response = await fetch("/mode/current");
                if (!response.ok) throw new Error(`Status ${response.status}`);
                const data = await response.json();
                document.getElementById("current_mode").textContent = data.mode_name;
            } catch (err) {
                console.error("Failed to fetch current mode:", err);
                document.getElementById("current_mode").textContent = "unknown";
            }
        }

        async function setMode(modeName) {
            const statusEl = document.getElementById("mode_status");
            statusEl.textContent = `Switching to ${modeName.toUpperCase()}...`;
            try {
                const response = await fetch(`/mode/${modeName}`, { method: "POST" });
                if (!response.ok) throw new Error(`Status ${response.status}`);
                const data = await response.json();
                if (data.status === "ok") {
                    statusEl.textContent = `Mode set to ${data.mode}`;
                } else {
                    statusEl.textContent = `Error: ${data.message}`;
                }
            } catch (err) {
                statusEl.textContent = `Failed to set mode: ${err}`;
                console.error("Failed to set mode:", err);
            }
            // give the vehicle a moment to actually switch before re-checking
            setTimeout(updateCurrentMode, 500);
        }

        async function goToWaypoint() {
            const statusEl = document.getElementById("waypoint_status");
            const lat = parseFloat(document.getElementById("wp_lat").value);
            const lon = parseFloat(document.getElementById("wp_lon").value);

            if (isNaN(lat) || isNaN(lon)) {
                statusEl.textContent = "Enter a valid latitude and longitude";
                return;
            }

            statusEl.textContent = "Sending waypoint...";
            try {
                const response = await fetch("/waypoint", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ latitude: lat, longitude: lon }),
                });
                if (!response.ok) throw new Error(`Status ${response.status}`);
                const data = await response.json();
                if (data.status === "ok") {
                    statusEl.textContent = `Heading to ${data.latitude.toFixed(6)}, ${data.longitude.toFixed(6)}`;
                } else {
                    statusEl.textContent = `Error: ${data.message}`;
                }
            } catch (err) {
                statusEl.textContent = `Failed to send waypoint: ${err}`;
                console.error("Failed to send waypoint:", err);
            }
            setTimeout(updateCurrentMode, 500);
        }

        function useCurrentPositionAsWaypoint() {
            if (lastGPS && lastGPS.has_fix) {
                document.getElementById("wp_lat").value = lastGPS.latitude.toFixed(6);
                document.getElementById("wp_lon").value = lastGPS.longitude.toFixed(6);
            }
        }

        async function emergencyStop() {
            const statusEl = document.getElementById("stop_status");
            statusEl.textContent = "Stopping...";
            try {
                const response = await fetch("/disarm", { method: "POST" });
                if (!response.ok) throw new Error(`Status ${response.status}`);
                const data = await response.json();
                statusEl.textContent = "Disarmed";
            } catch (err) {
                statusEl.textContent = `Failed to stop: ${err}`;
                console.error("Failed to disarm:", err);
            }
            setTimeout(updateCurrentMode, 500);
        }

        updateGPS();
        updateCurrentMode();
        setInterval(updateGPS, 1000);
        setInterval(updateLastGPS, 100);
        setInterval(updateCurrentMode, 1000);
    </script>
</body>
</html>
